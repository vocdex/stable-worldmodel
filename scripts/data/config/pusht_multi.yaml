defaults:
  - _self_

# Defaults to a local-runnable config (no SLURM). For cluster submission
# pass:
#   hydra/launcher=submitit_slurm \
#   +hydra.launcher.max_num_timeout=999 \
#   +hydra.launcher.cpus_per_task=8 \
#   +hydra.launcher.mem_gb=256 \
#   +hydra.launcher.timeout_min=1440 \
#   +hydra.launcher.partition=long-cpu \
#   +hydra.launcher.signal_delay_s=120 \
#   hydra.mode=MULTIRUN
hydra:
  output_subdir: null
  run:
    dir: .

# ---- Identity / split selection ----
# `objects` is the env's "available identities" (must be consistent
# across all datasets a single SC model will see).
# `enabled_objects` picks which of those are *active* per episode
# (used only when subset_mode=fixed).
# `subset_mode`:
#   fixed  — every episode uses `enabled_objects` verbatim.
#   random — every episode samples k ~ U[k_min, k_max] then a uniform
#            subset of that size from `objects`. Use this for the
#            SlotContrast training set so SC sees varied k and varied
#            identity combinations.
objects: [A, B, C, D, E, F]
enabled_objects: [A, B]
dataset_name: pusht_multi_AB
subset_mode: fixed
subset_k_range: [1, 6]

# ---- Collection scale ----
# Single HDF5 file per dataset at <cache>/datasets/<dataset_name>.h5.
# Re-running with the same dataset_name resumes from the existing file.
num_traj: 10000
seed: 3072
cache_dir: null

# ---- World wrapper ----
# max_episode_steps scales with k: rule of thumb 60 + 60*k. With k=2 → 180.
world:
  num_envs: 8
  max_episode_steps: 180
  image_shape: [224, 224]

# ---- Policy ----
# policy.kind = weak | expert
#   weak   — MultiObjectWeakPolicy (random with focus bias + wedge mode).
#            Coverage-driven; produces few successes.
#   expert — MultiObjectGoalPolicy (state-based push-toward-goal).
#            Privileged state info + Gaussian action noise — mirrors the
#            18k-traj scripted PushT expert.
policy:
  kind: expert
  # MultiObjectWeakPolicy params
  dist_constraint: 100
  switch_every: 10
  p_wedge: 0.3
  # MultiObjectGoalPolicy params
  push_distance: 60
  noise_std: 0.15
  expert_switch_every: 40
  switch_pos_tol: 18
