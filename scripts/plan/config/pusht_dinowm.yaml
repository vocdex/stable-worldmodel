defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???   # filled by eval_wm.py = 2 * eval.eval_budget
  history_size: 3          # MUST equal DINO-WM num_hist; pusht.yaml uses 1
  frame_skip: 1

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42

# Loader-side knobs read by the dispatch in scripts/plan/eval_wm.py.
policy_kind: dino_wm_external
policy: /home/nazirjon/Downloads/outputs/outputs/pusht
dino_wm_src: /home/nazirjon/Desktop/dino_wm
dino_wm_alpha: 1.0          # paper sweeps {0.1, 1.0}

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5           # frameskip — must equal DINO-WM frameskip

eval:
  num_eval: 50
  goal_offset_steps: 5      # DINO-WM plan_settings.goal_H = 5
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  variation_overrides: null  # set via override, e.g. eval.variation_overrides='{variation: [block.color], variation_values: {block.color: [255,0,0]}}'
  stop_on_success: true       # break the eval loop once every env has reached the goal at least once (truncates rollout videos to the actual planning trajectory)
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_dinowm_results.txt
