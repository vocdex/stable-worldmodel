defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???   # filled by eval_wm.py = 2 * eval.eval_budget
  history_size: 1          # MUST equal DINO-WM num_hist; pusht.yaml uses 1
  frame_skip: 1

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42

# Loader-side knobs read by the dispatch in scripts/plan/eval_wm.py.
policy_kind: dino_wm_external
policy: /home/nazirjon/Desktop/dino_wm/checkpoints/outputs/pusht
dino_wm_src: /home/nazirjon/Desktop/dino_wm
dino_wm_alpha: 1.0           # paper sweeps {0.1, 1.0}
dino_wm_rollout_chunk: 64    # CEM batch chunk inside the adapter; lower → less VRAM, slower
# NOTE: action/proprio normalization is handled by SWM's policy + CEM stack
# (process[k].transform in _prepare_info; CEM samples in standardized space).
# The adapter must NOT re-normalize — that was the prior 20-30% SR bug.

plan_config:
  horizon: 5                # cjepa canonical
  receding_horizon: 5       # cjepa canonical
  action_block: 5           # frameskip — must equal DINO-WM frameskip

eval:
  num_eval: 50
  # Match cjepa/src/plan/config.yaml + scripts/pusht/plan_wm.sh.
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  # DINO-WM h5 was generated with block scale hardcoded to 30 (see dino_wm
  # env/pusht/pusht_env.py:779 — `scale=30` overrides the kwarg). SWM removed
  # that override and now defaults to 40 from variation_space. The model only
  # ever saw scale-30 imagery, so we must force scale=30 here, otherwise
  # current obs (scale 40) and goal obs (h5, scale 30) look different to the
  # model and SR collapses.
  variation_overrides:
    variation: [block.scale, goal.scale]
    variation_values:
      block.scale: 30
      goal.scale: 30
  stop_on_success: false      # match cjepa: run full eval_budget regardless
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_dinowm_results.txt
